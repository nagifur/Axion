<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="200" height="200" shape-rendering="crispEdges">
  <defs>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.1" result="blur"/>
    </filter>
    <filter id="borderGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="0.5" result="blur"/>
    </filter>
  </defs>

  <!-- transparent background (no bg rect) -->

  <!-- border glow (soft) -->
  <rect x="1" y="1" width="22" height="22" rx="3" ry="3"
        fill="none" stroke="#00f0ff" stroke-width="1" opacity="0.6"
        filter="url(#borderGlow)" shape-rendering="geometricPrecision"/>

  <!-- crisp square border frame, slightly rounded -->
  <rect x="1" y="1" width="22" height="22" rx="3" ry="3"
        fill="none" stroke="#7CFBFF" stroke-width="1"
        shape-rendering="geometricPrecision"/>

  <!-- glow layer (soft, sits behind) -->
  <g filter="url(#glow)" fill="#00f0ff" opacity="0.85">
    <rect x="9" y="4" width="6" height="1" fill="#00f0ff"/>
    <rect x="8" y="5" width="8" height="1" fill="#00f0ff"/>
    <rect x="7" y="6" width="10" height="1" fill="#00f0ff"/>
    <rect x="7" y="7" width="10" height="1" fill="#00f0ff"/>
    <rect x="7" y="8" width="10" height="1" fill="#00f0ff"/>
    <rect x="7" y="9" width="10" height="1" fill="#00f0ff"/>
    <rect x="7" y="10" width="10" height="1" fill="#00f0ff"/>
    <rect x="7" y="11" width="10" height="1" fill="#00f0ff"/>
    <rect x="8" y="12" width="8" height="1" fill="#00f0ff"/>
    <rect x="9" y="13" width="6" height="1" fill="#00f0ff"/>
    <rect x="7" y="15" width="10" height="1" fill="#00f0ff"/>
    <rect x="6" y="16" width="12" height="1" fill="#00f0ff"/>
    <rect x="5" y="17" width="14" height="1" fill="#00f0ff"/>
    <rect x="4" y="18" width="16" height="1" fill="#00f0ff"/>
    <rect x="3" y="19" width="18" height="1" fill="#00f0ff"/>
    <rect x="3" y="20" width="18" height="1" fill="#00f0ff"/>
    <rect x="2" y="21" width="20" height="1" fill="#00f0ff"/>
    <rect x="2" y="22" width="20" height="1" fill="#00f0ff"/>
    <rect x="1" y="23" width="22" height="1" fill="#00f0ff"/>
    
  </g>

  <!-- crisp pixel layer (no smoothing) -->
  <g fill="#7CFBFF">
    <rect x="9" y="4" width="6" height="1" fill="#7CFBFF"/>
    <rect x="8" y="5" width="8" height="1" fill="#7CFBFF"/>
    <rect x="7" y="6" width="10" height="1" fill="#7CFBFF"/>
    <rect x="7" y="7" width="10" height="1" fill="#7CFBFF"/>
    <rect x="7" y="8" width="10" height="1" fill="#7CFBFF"/>
    <rect x="7" y="9" width="10" height="1" fill="#7CFBFF"/>
    <rect x="7" y="10" width="10" height="1" fill="#7CFBFF"/>
    <rect x="7" y="11" width="10" height="1" fill="#7CFBFF"/>
    <rect x="8" y="12" width="8" height="1" fill="#7CFBFF"/>
    <rect x="9" y="13" width="6" height="1" fill="#7CFBFF"/>
    <rect x="7" y="15" width="10" height="1" fill="#7CFBFF"/>
    <rect x="6" y="16" width="12" height="1" fill="#7CFBFF"/>
    <rect x="5" y="17" width="14" height="1" fill="#7CFBFF"/>
    <rect x="4" y="18" width="16" height="1" fill="#7CFBFF"/>
    <rect x="3" y="19" width="18" height="1" fill="#7CFBFF"/>
    <rect x="3" y="20" width="18" height="1" fill="#7CFBFF"/>
    <rect x="2" y="21" width="20" height="1" fill="#7CFBFF"/>
    <rect x="2" y="22" width="20" height="1" fill="#7CFBFF"/>
    <rect x="1" y="23" width="22" height="1" fill="#7CFBFF"/>
    
  </g>
</svg>